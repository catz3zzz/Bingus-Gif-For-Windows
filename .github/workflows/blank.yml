name: CI

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup VNC
        shell: pwsh
        run: |
          curl -L -o "$env:TEMP\v.msi" "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi"
          Start-Process msiexec -ArgumentList "/i","$env:TEMP\v.msi","/quiet","/norestart","ADDLOCAL=Server" -Wait
          $v="C:\Program Files\TightVNC\tvnserver.exe"
          &$v -install -silent
          &$v -startservice
          Start-Sleep 2
          &$v -controlservice -setpassword pass1234
          Write-Host "VNC ready on 5900"
          
      - name: Setup Web
        shell: pwsh
        run: |
          curl -L -o "$env:TEMP\n.zip" "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip"
          Expand-Archive "$env:TEMP\n.zip" "$env:TEMP" -Force
          $g=Get-ChildItem "$env:TEMP" -Filter "noVNC-*" -Directory | Select -First 1
          Move-Item $g.FullName "$env:TEMP\novnc" -Force
          pip install websockify 2>$null
          Write-Host "noVNC ready at $env:TEMP\novnc"
          
      - name: Start Tunnel
        shell: cmd
        run: |
          start /B python -m websockify --web "%TEMP%\novnc" 5901 localhost:5900 >"%TEMP%\w.log" 2>&1
          timeout /t 5 /nobreak >nul
          curl -L -o "%TEMP%\c.exe" "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          start /B "" "%TEMP%\c.exe" tunnel --url http://localhost:5901 >"%TEMP%\c.log" 2>&1
          timeout /t 20 /nobreak >nul
          type "%TEMP%\c.log" | findstr "trycloudflare"
          type "%TEMP%\w.log"
          
      - name: Hold
        shell: pwsh
        run: |
          Write-Host "VNC Password: pass1234"
          Write-Host "URL above ^"
          while($true){Start-Sleep 300; Get-Date}
